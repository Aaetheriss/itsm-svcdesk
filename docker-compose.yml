services:
  svcdesk:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: /data/svcdesk.db
    volumes:
      - svcdesk-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    profiles: ["tests"]
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080
    command: ["python", "/tests/run_tests.py"]

volumes:
  svcdesk-data:
